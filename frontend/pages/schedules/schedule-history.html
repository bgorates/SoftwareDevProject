<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule History - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <h1>Schedule History</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">View past published schedules</p>
        </div>

        <div class="page-content">
            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
            
            <div class="table-container" id="historyTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Week Start</th>
                            <th>Week Range</th>
                            <th>Status</th>
                            <th>Published Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M8 7V3M16 7V3M3 11H21M5 5H19C20.1046 5 21 5.89543 21 7V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V7C3 5.89543 3.89543 5 5 5Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3>No schedule history</h3>
                <p>Published schedules will appear here</p>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/admin-login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/admin-login.html';
            }
        }

        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const historyTable = document.getElementById('historyTable');
        const historyTableBody = document.getElementById('historyTableBody');
        const emptyState = document.getElementById('emptyState');

        async function loadHistory() {
            loadingSpinner.style.display = 'flex';
            errorMessage.style.display = 'none';
            historyTable.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                // Note: This endpoint needs to be created in backend
                // GET /schedule/history or similar
                showError('Backend endpoint for schedule history not yet implemented.');
                
                // When available:
                // const history = await apiRequest('/schedule/history', { method: 'GET' });
                // renderHistory(history);
                
            } catch (error) {
                errorMessage.textContent = error.message || 'Failed to load schedule history';
                errorMessage.style.display = 'flex';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        function renderHistory(history) {
            if (!history || history.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            historyTableBody.innerHTML = history.map(item => {
                const weekStart = new Date(item.week_start || item.start_date);
                return `
                    <tr>
                        <td>${formatDate(weekStart)}</td>
                        <td>${formatWeekRange(weekStart)}</td>
                        <td>
                            <span class="badge badge-success">Published</span>
                        </td>
                        <td>${formatDateTime(item.published_at || item.created_at)}</td>
                        <td>
                            <button class="action-btn action-btn-primary" onclick="viewSchedule('${formatDate(weekStart)}')">View</button>
                        </td>
                    </tr>
                `;
            }).join('');

            historyTable.style.display = 'block';
        }

        function viewSchedule(weekStart) {
            window.location.href = `schedule-published.html?week_start=${weekStart}`;
        }

        // Load history on page load
        loadHistory();
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

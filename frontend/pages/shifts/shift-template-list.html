<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Templates - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Shift Templates</h1>
                    <p style="color: var(--text-secondary); margin-top: 8px;">Manage your shift templates</p>
                </div>
                <a href="shift-template-edit.html" class="btn btn-primary">Create Template</a>
            </div>
        </div>

        <div class="page-content">
            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
            
            <div class="table-container" id="templatesTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Template Name</th>
                            <th>Shift Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="templatesTableBody">
                        <!-- Templates will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 2V6M12 18V22M6 12H2M22 12H18M19.07 19.07L16.24 16.24M19.07 4.93L16.24 7.76M4.93 19.07L7.76 16.24M4.93 4.93L7.76 7.76" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h3>No shift templates found</h3>
                <p>Create your first shift template to get started</p>
                <a href="shift-template-edit.html" class="btn btn-primary">Create Template</a>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/login.html';
            }
        }

        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const templatesTable = document.getElementById('templatesTable');
        const templatesTableBody = document.getElementById('templatesTableBody');
        const emptyState = document.getElementById('emptyState');

        async function loadTemplates() {
            loadingSpinner.style.display = 'flex';
            errorMessage.style.display = 'none';
            templatesTable.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                const templates = await api.getTemplates();
                console.log('Templates loaded:', templates);
                renderTemplates(templates);
            } catch (error) {
                console.error('Error loading templates:', error);
                // If error is "Shift template not found", it likely means no templates exist yet
                // Show empty state instead of error
                if (error.message && error.message.includes('Shift template not found')) {
                    console.log('No templates found, showing empty state');
                    emptyState.style.display = 'block';
                    return;
                }
                errorMessage.textContent = error.message || 'Failed to load templates';
                errorMessage.style.display = 'flex';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        function renderTemplates(templates) {
            if (!templates || templates.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            templatesTableBody.innerHTML = templates.map(template => {
                const period = template.period || {};
                const shiftName = period.shift_name || 'N/A';
                const startTime = formatTime(template.shift_start);
                const endTime = formatTime(template.shift_end);
                const templateId = template.id || '';
                
                return `
                    <tr>
                        <td>${shiftName}</td>
                        <td>${startTime} - ${endTime}</td>
                        <td>
                            <div class="actions">
                                <button class="action-btn action-btn-primary" onclick="editTemplate(${templateId})">Edit</button>
                                <button class="action-btn action-btn-danger" onclick="deleteTemplate(${templateId})">Delete</button>
                                <button class="action-btn action-btn-primary" onclick="duplicateTemplate(${templateId})">Duplicate</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            templatesTable.style.display = 'block';
        }

        function editTemplate(id) {
            window.location.href = `shift-template-edit.html?id=${id}`;
        }

        async function deleteTemplate(id) {
            if (!await confirmDialog('Are you sure you want to delete this template?', 'Delete Template')) {
                return;
            }
            
            try {
                await api.deleteTemplate(id);
                showNotification('Template deleted successfully', 'success');
                loadTemplates();
            } catch (error) {
                showNotification(error.message || 'Failed to delete template', 'error');
            }
        }

        function duplicateTemplate(id) {
            // Navigate to edit page with duplicate flag
            window.location.href = `shift-template-edit.html?id=${id}&duplicate=true`;
        }

        // Load templates on page load
        loadTemplates();
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

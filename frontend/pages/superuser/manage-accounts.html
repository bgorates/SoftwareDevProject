<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Accounts - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .page-header {
            padding-left: 32px;
            border-radius: 16px;
            margin-bottom: 32px;
            padding: var(--spacing-lg) 32px;
            border-bottom: none;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .page-content {
            margin-left: 32px;
        }

        /* Dropdown styles */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .dropdown-toggle:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .dropdown-toggle svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
        }

        .dropdown.active .dropdown-toggle svg {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            min-width: 180px;
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .dropdown.active .dropdown-menu {
            display: block;
        }

        .dropdown-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: background 0.2s;
            border-bottom: 1px solid var(--border-color);
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: var(--bg-secondary);
        }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .profile-details {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-field-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .profile-field-value {
            font-size: 16px;
            color: var(--text-primary);
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Manage Accounts</h1>
                    <p style="color: var(--text-secondary); margin-top: 8px;">View and manage all business accounts</p>
                </div>
                <a href="create-business-account.html" class="btn btn-primary">Create New Account</a>
            </div>
        </div>

        <div class="page-content">
            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

            <div class="table-container" id="accountsTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Admin Email</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accountsTableBody">
                        <!-- Accounts will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path
                        d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13M16 3.13C16.8604 3.35031 17.623 3.85071 18.1676 4.55232C18.7122 5.25392 19.0078 6.11683 19.0078 7.005C19.0078 7.89318 18.7122 8.75608 18.1676 9.45769C17.623 10.1593 16.8604 10.6597 16 10.88M13 7C13 9.20914 11.2091 11 9 11C6.79086 11 5 9.20914 5 7C5 4.79086 6.79086 3 9 3C11.2091 3 13 4.79086 13 7Z"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <h3>No accounts found</h3>
                <p>Create your first business account to get started</p>
                <a href="create-business-account.html" class="btn btn-primary">Create Account</a>
            </div>
        </div>

        <!-- Profile Modal -->
        <div class="modal-overlay" id="profileModal">
            <div class="modal">
                <div class="modal-header">
                    <h2>User Profile</h2>
                    <button class="modal-close" onclick="closeProfileModal()">&times;</button>
                </div>
                <div class="profile-details" id="profileDetails">
                    <!-- Profile details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated() || getUserRole() !== 'superuser') {
            window.location.href = 'superuser-login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = 'superuser-login.html';
            }
        }

        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const accountsTable = document.getElementById('accountsTable');
        const accountsTableBody = document.getElementById('accountsTableBody');
        const emptyState = document.getElementById('emptyState');

        // Store accounts globally so we can access them in viewProfile
        let allAccounts = [];

        async function loadAccounts() {
            loadingSpinner.style.display = 'flex';
            errorMessage.style.display = 'none';
            accountsTable.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                // Fetch all users (no role filter)
                const accounts = await api.listUsers();
                allAccounts = accounts; // Store for later use
                renderAccounts(accounts);
            } catch (error) {
                console.error('Error loading accounts:', error);
                errorMessage.textContent = error.message || 'Failed to load accounts';
                errorMessage.style.display = 'flex';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'flex';
        }

        function renderAccounts(accounts) {
            if (!accounts || accounts.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            accountsTableBody.innerHTML = accounts.map(account => {
                const fullName = account.firstname && account.lastname
                    ? `${account.firstname} ${account.lastname}`
                    : account.username || 'Unknown';
                const status = account.is_active ? 'Active' : 'Pending invitation';

                return `
                <tr>
                    <td>${fullName}</td>
                    <td>${account.email}</td>
                    <td>
                        <span class="badge ${getStatusBadgeClass(status)}">
                            ${status}
                        </span>
                    </td>
                    <td>
                        <div class="dropdown" id="dropdown-${account.id}">
                            <button class="dropdown-toggle" onclick="toggleDropdown(${account.id})">
                                Actions
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <div class="dropdown-menu">
                                ${!account.is_active ? `
                                    <button class="dropdown-item" onclick="resendInvite(${account.id})">Resend Invite</button>
                                ` : ''}
                                <button class="dropdown-item" onclick="viewProfile(${account.id})">View Profile</button>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
            }).join('');

            accountsTable.style.display = 'block';
        }

        function getStatusBadgeClass(status) {
            switch (status) {
                case 'Active': return 'badge-success';
                case 'Pending invitation': return 'badge-warning';
                case 'Disabled': return 'badge-danger';
                default: return 'badge-secondary';
            }
        }

        // Toggle dropdown menu
        function toggleDropdown(accountId) {
            const dropdown = document.getElementById(`dropdown-${accountId}`);
            const allDropdowns = document.querySelectorAll('.dropdown');

            // Close all other dropdowns
            allDropdowns.forEach(d => {
                if (d.id !== `dropdown-${accountId}`) {
                    d.classList.remove('active');
                }
            });

            // Toggle current dropdown
            dropdown.classList.toggle('active');
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function (event) {
            if (!event.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown').forEach(d => {
                    d.classList.remove('active');
                });
            }
        });

        async function resendInvite(userId) {
            // Close dropdown
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));

            if (!confirm('Resend invitation to this user?')) return;

            try {
                await api.sendInvite(userId);
                showNotification('Invitation resent successfully', 'success');
                loadAccounts();
            } catch (error) {
                showNotification(error.message || 'Failed to resend invitation', 'error');
            }
        }

        function viewProfile(userId) {
            // Close dropdown
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));

            // Find the user in our stored accounts
            const user = allAccounts.find(account => account.id === userId);

            if (!user) {
                showNotification('User not found', 'error');
                return;
            }

            // Display profile modal
            const profileDetails = document.getElementById('profileDetails');
            const fullName = user.firstname && user.lastname
                ? `${user.firstname} ${user.lastname}`
                : 'N/A';

            profileDetails.innerHTML = `
                <div class="profile-field">
                    <div class="profile-field-label">Full Name</div>
                    <div class="profile-field-value">${fullName}</div>
                </div>
                <div class="profile-field">
                    <div class="profile-field-label">Email</div>
                    <div class="profile-field-value">${user.email || 'N/A'}</div>
                </div>
                <div class="profile-field">
                    <div class="profile-field-label">Username</div>
                    <div class="profile-field-value">${user.username || 'N/A'}</div>
                </div>
                <div class="profile-field">
                    <div class="profile-field-label">Status</div>
                    <div class="profile-field-value">
                        <span class="badge ${user.is_active ? 'badge-success' : 'badge-warning'}">
                            ${user.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                </div>
                <div class="profile-field">
                    <div class="profile-field-label">User Role</div>
                    <div class="profile-field-value">${user.user_role || 'N/A'}</div>
                </div>
                ${user.business_id ? `
                    <div class="profile-field">
                        <div class="profile-field-label">Business ID</div>
                        <div class="profile-field-value">${user.business_id}</div>
                    </div>
                ` : ''}
            `;

            // Show modal
            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('profileModal').addEventListener('click', function (event) {
            if (event.target === this) {
                closeProfileModal();
            }
        });

        // Load accounts on page load
        loadAccounts();
    </script>
    <script src="../../components/navbar.js"></script>
</body>

</html>

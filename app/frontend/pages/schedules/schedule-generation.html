<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Generation - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <h1>Schedule Generation</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">Start building a schedule</p>
        </div>

        <div class="page-content">
            <form id="generateForm">
                <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success" style="display: none;"></div>

                <div class="form-group">
                    <label for="week_start">Week Selection *</label>
                    <input type="date" id="week_start" class="form-control" required>
                    <small style="color: var(--text-secondary); margin-top: 4px; display: block;">Select the start date of the week (Monday)</small>
                </div>

                <div class="card-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="generateBtn">Generate Schedule</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/login.html';
            }
        }

        const form = document.getElementById('generateForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const generateBtn = document.getElementById('generateBtn');
        const weekStartInput = document.getElementById('week_start');

        // Set default to next Monday
        const nextMonday = getWeekStart(new Date());
        weekStartInput.value = formatDate(nextMonday);

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'flex';
            successMessage.style.display = 'none';
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'flex';
            errorMessage.style.display = 'none';
        }

        function setLoading(loading) {
            generateBtn.disabled = loading;
            generateBtn.textContent = loading ? 'Generating...' : 'Generate Schedule';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            showError('');
            showSuccess('');

            const weekStart = weekStartInput.value;

            if (!weekStart) {
                showError('Please select a week start date');
                setLoading(false);
                return;
            }

            try {
                const schedule = await api.generateSchedule(weekStart);
                showSuccess('Schedule generated successfully! Redirecting to draft...');
                
                setTimeout(() => {
                    window.location.href = `schedule-draft.html?week_start=${weekStart}`;
                }, 1500);
            } catch (error) {
                showError(error.message || 'Failed to generate schedule. Please try again.');
                setLoading(false);
            }
        });
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

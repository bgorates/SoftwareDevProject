<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superuser Dashboard - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .page-header {
            padding-left: 32px;
            border-radius: 16px;
            margin-bottom: 32px;
            padding: var(--spacing-lg) 32px;
            border-bottom: none;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }
        
        .dashboard-card {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .dashboard-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .dashboard-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .dashboard-card-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }
        
        .dashboard-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .dashboard-card p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
            margin-left: 32px;
        }
        
        .stat-card {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <h1>Superuser Dashboard</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">High-level management area</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be loaded here -->
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card" onclick="window.location.href='create-business-account.html'">
                <div class="dashboard-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4V20M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h3>Create Business Account</h3>
                <p>Create a new restaurant admin account</p>
            </div>

            <div class="dashboard-card" onclick="window.location.href='manage-accounts.html'">
                <div class="dashboard-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13M16 3.13C16.8604 3.35031 17.623 3.85071 18.1676 4.55232C18.7122 5.25392 19.0078 6.11683 19.0078 7.005C19.0078 7.89318 18.7122 8.75608 18.1676 9.45769C17.623 10.1593 16.8604 10.6597 16 10.88M13 7C13 9.20914 11.2091 11 9 11C6.79086 11 5 9.20914 5 7C5 4.79086 6.79086 3 9 3C11.2091 3 13 4.79086 13 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h3>View All Accounts</h3>
                <p>Manage all business accounts and invitations</p>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated() || getUserRole() !== 'superuser') {
            window.location.href = 'superuser-login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = 'superuser-login.html';
            }
        }

        // Load basic stats
        async function loadStats() {
            try {
                const statsGrid = document.getElementById('statsGrid');
                
                // Fetch all managers (managers have user_role='user' in the database)
                const managers = await api.listUsers('user');
                
                const totalAccounts = managers.length;
                const activeAccounts = managers.filter(m => m.is_active).length;
                const pendingInvites = managers.filter(m => !m.is_active).length;
                
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${totalAccounts}</div>
                        <div class="stat-label">Total Accounts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${activeAccounts}</div>
                        <div class="stat-label">Active Accounts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${pendingInvites}</div>
                        <div class="stat-label">Pending Invites</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Total Accounts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Active Accounts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Pending Invites</div>
                    </div>
                `;
            }
        }

        // Load stats on page load
        loadStats();
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

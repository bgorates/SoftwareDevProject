<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Constraints - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .page-header {
            padding-left: 32px;
            border-radius: 16px;
            margin-bottom: 32px;
            padding: var(--spacing-lg) 32px;
            border-bottom: none;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        
        .page-content {
            margin-left: 32px;
        }
    </style>
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Employee Constraints</h1>
                    <p style="color: var(--text-secondary); margin-top: 8px;">View and manage employee availability and preferences</p>
                </div>
                <a href="employee-constraint-new.html" class="btn btn-primary">+ New</a>
            </div>
        </div>

        <div class="page-content">
            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
            
            <div class="table-container" id="constraintsTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Days Available</th>
                            <th>Shift Preference</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="constraintsTableBody">
                        <!-- Constraints will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3>No constraints found</h3>
                <p>No employee constraints have been set yet</p>
                <a href="employee-constraint-new.html" class="btn btn-primary">Create First Constraint</a>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/admin-login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/admin-login.html';
            }
        }

        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const constraintsTable = document.getElementById('constraintsTable');
        const constraintsTableBody = document.getElementById('constraintsTableBody');
        const emptyState = document.getElementById('emptyState');

        async function loadConstraints() {
            loadingSpinner.style.display = 'flex';
            errorMessage.style.display = 'none';
            constraintsTable.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                // Fetch all active constraints
                const constraints = await api.getConstraints({ is_active: true });
                renderConstraints(constraints || []);
            } catch (error) {
                console.error('Error loading constraints:', error);
                // If no constraints found (404), show empty state
                if (error.message && (error.message.includes('404') || error.message.includes('not found'))) {
                    renderConstraints([]);
                } else {
                    errorMessage.textContent = error.message || 'Failed to load constraints';
                    errorMessage.style.display = 'flex';
                }
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'flex';
        }

        function renderConstraints(constraints) {
            if (!constraints || constraints.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            constraintsTableBody.innerHTML = constraints.map(constraint => {
                const employeeName = constraint.talent 
                    ? `${constraint.talent.firstname || ''} ${constraint.talent.lastname || ''}`.trim() 
                    : 'Unknown Employee';
                
                // Extract days from rules
                const days = [];
                if (constraint.rules && Array.isArray(constraint.rules)) {
                    constraint.rules.forEach(rule => {
                        if (rule.day && !days.includes(rule.day)) {
                            days.push(rule.day);
                        }
                    });
                }
                const daysDisplay = days.length > 0 ? days.join(', ') : 'None';
                
                // Extract shifts from rules
                const shifts = [];
                if (constraint.rules && Array.isArray(constraint.rules)) {
                    constraint.rules.forEach(rule => {
                        if (rule.shifts) {
                            const shiftValue = rule.shifts;
                            let shiftLabel = shiftValue;
                            if (shiftValue === 'am') shiftLabel = 'Morning';
                            else if (shiftValue === 'pm') shiftLabel = 'Afternoon';
                            else if (shiftValue === 'lounge') shiftLabel = 'Evening';
                            
                            if (!shifts.includes(shiftLabel)) {
                                shifts.push(shiftLabel);
                            }
                        }
                    });
                }
                const shiftsDisplay = shifts.length > 0 ? shifts.join(', ') : 'None';
                
                // Get constraint ID - it might be in different places depending on API response
                const constraintId = constraint.id || constraint.constraint_id;
                
                return `
                <tr>
                    <td>${employeeName}</td>
                    <td>${daysDisplay}</td>
                    <td>${shiftsDisplay}</td>
                    <td>
                        <div class="actions">
                            <button class="action-btn action-btn-danger" onclick="deleteConstraint(${constraintId})">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
            }).join('');

            constraintsTable.style.display = 'block';
        }

        async function deleteConstraint(constraintId) {
            if (!confirm('Are you sure you want to delete this constraint? This action cannot be undone.')) {
                return;
            }
            
            try {
                await api.deleteConstraint(constraintId);
                showNotification('Constraint deleted successfully', 'success');
                loadConstraints(); // Reload the list
            } catch (error) {
                console.error('Error deleting constraint:', error);
                showNotification(error.message || 'Failed to delete constraint', 'error');
            }
        }

        // Make deleteConstraint available globally
        window.deleteConstraint = deleteConstraint;

        // Load constraints on page load
        loadConstraints();
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

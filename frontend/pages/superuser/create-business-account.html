<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Business Account - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .page-header {
            padding-left: 32px;
            border-radius: 16px;
            margin-bottom: 32px;
            padding: var(--spacing-lg) 32px;
            border-bottom: none;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .page-content {
            margin-left: 32px;
        }
    </style>
</head>

<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <h1>Create Business Account</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">Create a new restaurant admin account</p>
        </div>

        <div class="page-content">
            <form id="createAccountForm">
                <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success" style="display: none;"></div>

                <div class="form-group">
                    <label for="firstname">First Name *</label>
                    <input type="text" id="firstname" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name *</label>
                    <input type="text" id="lastname" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Admin Email *</label>
                    <input type="email" id="email" class="form-control" required placeholder="admin@restaurant.com">
                    <small style="color: var(--text-secondary); margin-top: 4px; display: block;">This email will
                        receive the invitation</small>
                </div>

                <div class="form-group">
                    <label for="user_role">User Role *</label>
                    <select id="user_role" class="form-control" required>
                        <option value="">Select role</option>
                        <option value="admin">Admin</option>
                        <option value="manager">Manager</option>
                        <option value="user">User</option>
                    </select>
                </div>

                <div class="card-footer">
                    <button type="button" class="btn btn-secondary"
                        onclick="window.location.href='superuser-dashboard.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Create Account & Send Invite</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated() || getUserRole() !== 'superuser') {
            window.location.href = 'superuser-login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = 'superuser-login.html';
            }
        }

        const form = document.getElementById('createAccountForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'flex';
            successMessage.style.display = 'none';
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'flex';
            errorMessage.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            showError('');
            showSuccess('');

            const formData = {
                firstname: document.getElementById('firstname').value.trim(),
                lastname: document.getElementById('lastname').value.trim(),
                email: document.getElementById('email').value.trim(),
                user_role: document.getElementById('user_role').value,
            };

            // Validation
            const errors = validateRequired(formData);
            if (Object.keys(errors).length > 0) {
                showError('Please fill in all required fields');
                submitBtn.disabled = false;
                return;
            }

            if (!isValidEmail(formData.email)) {
                showError('Please enter a valid email address');
                submitBtn.disabled = false;
                return;
            }

            try {
                // Create user
                const user = await api.createUser(formData);

                // Send invite using the user's id
                await api.sendInvite(user.id);

                showSuccess('Account created and invitation sent successfully!');

                setTimeout(() => {
                    window.location.href = 'manage-accounts.html';
                }, 2000);
            } catch (error) {
                showError(error.message || 'Failed to create account. Please try again.');
                submitBtn.disabled = false;
            }
        });
    </script>
    <script src="../../components/navbar.js"></script>
</body>

</html>

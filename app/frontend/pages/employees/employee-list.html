<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Employees</h1>
                    <p style="color: var(--text-secondary); margin-top: 8px;">Manage your team members</p>
                </div>
                <a href="employee-edit.html" class="btn btn-primary" id="addEmployeeBtn" style="display: none;">Add Employee</a>
            </div>
        </div>

        <div class="page-content">
            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
            
            <div class="table-container" id="employeesTable" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeesTableBody">
                        <!-- Employees will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13M16 3.13C16.8604 3.35031 17.623 3.85071 18.1676 4.55232C18.7122 5.25392 19.0078 6.11683 19.0078 7.005C19.0078 7.89318 18.7122 8.75608 18.1676 9.45769C17.623 10.1593 16.8604 10.6597 16 10.88M13 7C13 9.20914 11.2091 11 9 11C6.79086 11 5 9.20914 5 7C5 4.79086 6.79086 3 9 3C11.2091 3 13 4.79086 13 7Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3>No employees found</h3>
                <p id="emptyStateMessage">No employees in the system yet</p>
                <a href="employee-edit.html" class="btn btn-primary" id="emptyStateAddBtn" style="display: none;">Add Employee</a>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/login.html';
        }

        // Check user role and show/hide "Add Employee" button
        function checkPermissions() {
            const userRole = getUserRole();
            console.log('Current user role:', userRole);
            console.log('localStorage user_role:', localStorage.getItem('user_role'));
            console.log('sessionStorage user_role:', sessionStorage.getItem('user_role'));
            
            const addEmployeeBtn = document.getElementById('addEmployeeBtn');
            const emptyStateAddBtn = document.getElementById('emptyStateAddBtn');
            const emptyStateMessage = document.getElementById('emptyStateMessage');
            
            // Only managers and admins can add employees
            if (userRole === 'manager') {
                console.log('User is manager/admin, showing Add Employee button');
                if (addEmployeeBtn) {
                    addEmployeeBtn.style.display = 'inline-block';
                }
                if (emptyStateAddBtn) {
                    emptyStateAddBtn.style.display = 'inline-block';
                }
                if (emptyStateMessage) {
                    emptyStateMessage.textContent = 'Add your first employee to get started';
                }
            } else {
                console.log('User is not manager/admin, hiding Add Employee button. Role:', userRole);
                // Hide the button for regular employees
                if (addEmployeeBtn) {
                    addEmployeeBtn.style.display = 'none';
                }
                if (emptyStateAddBtn) {
                    emptyStateAddBtn.style.display = 'none';
                }
                if (emptyStateMessage) {
                    emptyStateMessage.textContent = 'No employees found. Contact your manager to add employees.';
                }
            }
        }
        
        // Check permissions when page loads
        checkPermissions();

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/login.html';
            }
        }

        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const employeesTable = document.getElementById('employeesTable');
        const employeesTableBody = document.getElementById('employeesTableBody');
        const emptyState = document.getElementById('emptyState');

        async function loadEmployees() {
            loadingSpinner.style.display = 'flex';
            errorMessage.style.display = 'none';
            employeesTable.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                console.log('Loading employees...');
                const talents = await api.getTalents();
                console.log('Employees loaded:', talents);
                renderEmployees(talents);
            } catch (error) {
                console.error('Error loading employees:', error);
                
                // If error is "Talent not found", it likely means no employees exist yet
                // Show empty state instead of error
                if (error.message && error.message.includes('Talent not found')) {
                    console.log('No employees found, showing empty state');
                    emptyState.style.display = 'block';
                    return;
                }
                
                errorMessage.textContent = error.message || 'Failed to load employees. Please check your permissions.';
                errorMessage.style.display = 'flex';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        function renderEmployees(talents) {
            if (!talents || talents.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            const currentUserRole = getUserRole();
            const canEdit = currentUserRole === 'manager';

            employeesTableBody.innerHTML = talents.map((talent, index) => {
                const id = talent.id || index;
                const fullName = `${talent.firstname || ''} ${talent.lastname || ''}`.trim() || 'Unnamed Employee';
                const role = formatRole(talent.tal_role || 'N/A');
                const isActive = talent.is_active !== undefined ? talent.is_active : true;
                
                return `
                <tr>
                    <td>${fullName}</td>
                    <td>${role}</td>
                    <td>
                        <span class="badge ${isActive ? 'badge-success' : 'badge-danger'}">
                            ${isActive ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td>
                        <div class="actions">
                            ${canEdit ? `
                                <button class="action-btn action-btn-primary" onclick="editEmployee(${id})">Edit</button>
                                <button class="action-btn action-btn-danger" onclick="deleteEmployee(${id})">Delete</button>
                            ` : `
                                <span style="color: var(--text-secondary);">View only</span>
                            `}
                        </div>
                    </td>
                </tr>
            `;
            }).join('');

            employeesTable.style.display = 'block';
        }

        function editEmployee(id) {
            window.location.href = `employee-edit.html?id=${id}`;
        }

        async function deleteEmployee(id) {
            if (!await confirmDialog('Are you sure you want to delete this employee?', 'Delete Employee')) {
                return;
            }
            
            try {
                // Note: Delete endpoint not yet implemented in backend
                showNotification('Delete functionality not yet implemented', 'warning');
                // When available:
                // await api.deleteTalent(id);
                // showNotification('Employee deleted successfully', 'success');
                // loadEmployees();
            } catch (error) {
                showNotification(error.message || 'Failed to delete employee', 'error');
            }
        }

        function viewDetails(id) {
            window.location.href = `employee-edit.html?id=${id}`;
        }

        // Load employees on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
        });
        
        // Also call immediately if DOM is already loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadEmployees);
        } else {
            loadEmployees();
        }
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

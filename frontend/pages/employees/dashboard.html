<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .page-header {
            padding-left: 32px;
            border-radius: 16px;
            margin-bottom: 32px;
            padding: var(--spacing-lg) 32px;
            border-bottom: none;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        
        .dashboard-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 32px;
            margin-left: 32px;
        }
        
        .dashboard-link {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
            display: block;
            box-shadow: var(--shadow-sm);
        }
        
        .dashboard-link:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }
        
        .dashboard-link h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }
        
        .dashboard-link p {
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <h1>Dashboard</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">Overview of your shift management system</p>
        </div>

        <div class="page-content">
            <div class="dashboard-links">
                <a href="employee-list.html" class="dashboard-link">
                    <h3>Employees</h3>
                    <p>Manage your team members</p>
                </a>

                <a href="employee-constraints.html" class="dashboard-link">
                    <h3>Constraints</h3>
                    <p>Set employee availability and preferences</p>
                </a>

                <a href="../shifts/shift-template-list.html" class="dashboard-link">
                    <h3>Shift Templates</h3>
                    <p>Create and manage shift templates</p>
                </a>

                <a href="../schedules/schedule-generation.html" class="dashboard-link">
                    <h3>Schedule Generation</h3>
                    <p>Generate new schedules</p>
                </a>

                <a href="../schedules/schedule-history.html" class="dashboard-link">
                    <h3>Schedule History</h3>
                    <p>View past schedules</p>
                </a>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/admin-login.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/admin-login.html';
            }
        }
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SlotMeIn</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/pages/auth/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="48" height="48" rx="12" fill="#4F46E5"/>
                        <path d="M24 12L32 20H28V32H20V20H16L24 12Z" fill="white"/>
                        <path d="M12 36H36V40H12V36Z" fill="white" fill-opacity="0.8"/>
                    </svg>
                </div>
                <h1>Reset Password</h1>
                <p class="subtitle">Activate your account</p>
            </div>

            <form id="resetForm" class="login-form">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 2C8.34315 2 7 3.34315 7 5V7H5C3.89543 7 3 7.89543 3 9V16C3 17.1046 3.89543 18 5 18H15C16.1046 18 17 17.1046 17 16V9C17 7.89543 16.1046 7 15 7H13V5C13 3.34315 11.6569 2 10 2ZM10 4C10.5523 4 11 4.44772 11 5V7H9V5C9 4.44772 9.44772 4 10 4Z" fill="#6B7280"/>
                        </svg>
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            placeholder="Enter new password" 
                            required 
                            minlength="8"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 2C8.34315 2 7 3.34315 7 5V7H5C3.89543 7 3 7.89543 3 9V16C3 17.1046 3.89543 18 5 18H15C16.1046 18 17 17.1046 17 16V9C17 7.89543 16.1046 7 15 7H13V5C13 3.34315 11.6569 2 10 2ZM10 4C10.5523 4 11 4.44772 11 5V7H9V5C9 4.44772 9.44772 4 10 4Z" fill="#6B7280"/>
                        </svg>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm new password" 
                            required 
                            minlength="8"
                        >
                    </div>
                </div>

                <button type="submit" class="login-button" id="submitButton">
                    <span class="button-text">Activate Account</span>
                    <span class="button-loader" style="display: none;">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="10" cy="10" r="8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                                <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416;0 31.416" repeatCount="indefinite"/>
                                <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416;-31.416" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('errorMessage').textContent = 'Invalid or missing invitation token';
            document.getElementById('errorMessage').style.display = 'flex';
        }

        const form = document.getElementById('resetForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitButton = document.getElementById('submitButton');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'flex';
            successMessage.style.display = 'none';
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'flex';
            errorMessage.style.display = 'none';
        }

        function setLoading(loading) {
            submitButton.disabled = loading;
            const buttonText = submitButton.querySelector('.button-text');
            const buttonLoader = submitButton.querySelector('.button-loader');
            if (loading) {
                buttonText.style.display = 'none';
                buttonLoader.style.display = 'flex';
            } else {
                buttonText.style.display = 'inline';
                buttonLoader.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            showError('');
            showSuccess('');

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showError('Password must be at least 8 characters long');
                setLoading(false);
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                setLoading(false);
                return;
            }

            try {
                await api.acceptInvite(token, newPassword);
                showSuccess('Account activated successfully! Redirecting to login...');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                showError(error.message || 'Failed to activate account. Please check your invitation link.');
                setLoading(false);
            }
        });
    </script>
</body>
</html>

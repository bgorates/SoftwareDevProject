<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome to SlotMeIn!</h1>
                <p>Set your password to activate your account</p>
            </div>

            <form id="setPasswordForm">
                <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success" style="display: none;"></div>

                <div class="form-group">
                    <label for="newPassword">New Password *</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter your new password"
                        required minlength="8">
                    <small style="color: var(--text-secondary); margin-top: 4px; display: block;">
                        Minimum 8 characters
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                        required minlength="8">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    Activate Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="admin-login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const form = document.getElementById('setPasswordForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // Check if token exists
        if (!token) {
            showError('Invalid or missing activation token. Please use the link from your invitation email.');
            submitBtn.disabled = true;
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'flex';
            successMessage.style.display = 'none';
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'flex';
            errorMessage.style.display = 'none';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Activating...' : 'Activate Account';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validation
            if (newPassword.length < 8) {
                showError('Password must be at least 8 characters long');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            setLoading(true);
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const response = await api.setNewPassword(token, newPassword);

                showSuccess('Account activated successfully! Redirecting to login...');

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'admin-login.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showError(error.message || 'Failed to activate account. The link may have expired or already been used.');
                setLoading(false);
            }
        });

        // Real-time password match validation
        confirmPasswordInput.addEventListener('input', () => {
            if (confirmPasswordInput.value && newPasswordInput.value !== confirmPasswordInput.value) {
                confirmPasswordInput.setCustomValidity('Passwords do not match');
            } else {
                confirmPasswordInput.setCustomValidity('');
            }
        });
    </script>
</body>

</html>

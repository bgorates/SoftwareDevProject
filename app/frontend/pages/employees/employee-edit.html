<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create/Edit Employee - SlotMeIn</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div id="navbar-container" data-brand-link="dashboard.html"></div>
    <div class="container">
        <div class="page-header">
            <h1 id="pageTitle">Create Employee</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;" id="pageSubtitle">Add a new employee to your team</p>
        </div>

        <div class="page-content">
            <form id="employeeForm">
                <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success" style="display: none;"></div>

                <div class="form-group">
                    <label for="firstname">First Name *</label>
                    <input type="text" id="firstname" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name *</label>
                    <input type="text" id="lastname" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="tal_role">Role *</label>
                    <select id="tal_role" class="form-control" required>
                        <option value="">Select role</option>
                        <option value="manager">Manager</option>
                        <option value="assistant manager">Assistant Manager</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="bartender">Bartender</option>
                        <option value="server">Server</option>
                        <option value="runner">Runner</option>
                        <option value="hostess">Hostess</option>
                        <option value="job force">Job Force</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="contract_type">Employment Type *</label>
                    <select id="contract_type" class="form-control" required>
                        <option value="">Select type</option>
                        <option value="full-time">Full-time</option>
                        <option value="part-time">Part-time</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="start_date">Start Date *</label>
                    <input type="date" id="start_date" class="form-control" required>
                </div>

                <div class="card-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='employee-list.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = '../auth/login.html';
        }

        // Check if user has permission to create/edit employees
        const userRole = getUserRole();
        console.log('Current user role:', userRole);
        
        if (userRole !== 'manager') {
            // Hide the form and show permission error
            document.getElementById('employeeForm').style.display = 'none';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'alert alert-error';
            errorDiv.innerHTML = `
                <h3>Permission Denied</h3>
                <p>You need <strong>manager</strong> role to create or edit employees.</p>
                <p>Your current role: <strong>${userRole || 'unknown'}</strong></p>
                <p>Only managers can add employees to their teams. Please contact your administrator.</p>
                <a href="employee-list.html" class="btn btn-secondary" style="margin-top: 16px;">Back to Employee List</a>
            `;
            document.querySelector('.page-content').insertBefore(errorDiv, document.getElementById('employeeForm'));
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = '../auth/login.html';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const employeeId = urlParams.get('id');
        const isEdit = !!employeeId;

        const form = document.getElementById('employeeForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');

        if (isEdit) {
            pageTitle.textContent = 'Edit Employee';
            pageSubtitle.textContent = 'Update employee information';
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'flex';
            successMessage.style.display = 'none';
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'flex';
            errorMessage.style.display = 'none';
        }

        // Load employee data if editing
        if (isEdit) {
            loadEmployee();
        }

        async function loadEmployee() {
            try {
                const talent = await api.getTalent(employeeId);
                document.getElementById('firstname').value = talent.firstname || '';
                document.getElementById('lastname').value = talent.lastname || '';
                document.getElementById('email').value = talent.email || '';
                document.getElementById('tal_role').value = talent.tal_role || '';
                document.getElementById('contract_type').value = talent.contract_type || '';
                if (talent.start_date) {
                    document.getElementById('start_date').value = formatDate(talent.start_date);
                }
            } catch (error) {
                showError(error.message || 'Failed to load employee data');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            showError('');
            showSuccess('');

            const formData = {
                firstname: document.getElementById('firstname').value.trim(),
                lastname: document.getElementById('lastname').value.trim(),
                email: document.getElementById('email').value.trim(),
                tal_role: document.getElementById('tal_role').value,
                contract_type: document.getElementById('contract_type').value,
                start_date: document.getElementById('start_date').value,
            };

            // Validation
            const errors = validateRequired(formData);
            if (Object.keys(errors).length > 0) {
                showError('Please fill in all required fields');
                submitBtn.disabled = false;
                return;
            }

            if (!isValidEmail(formData.email)) {
                showError('Please enter a valid email address');
                submitBtn.disabled = false;
                return;
            }

            try {
                if (isEdit) {
                    await api.updateTalent(employeeId, formData);
                    showSuccess('Employee updated successfully!');
                } else {
                    await api.createTalent(formData);
                    showSuccess('Employee created successfully!');
                }
                
                setTimeout(() => {
                    window.location.href = 'employee-list.html';
                }, 1500);
            } catch (error) {
                showError(error.message || `Failed to ${isEdit ? 'update' : 'create'} employee. Please try again.`);
                submitBtn.disabled = false;
            }
        });
    </script>
        <script src="../../components/navbar.js"></script>
</body>
</html>
